name: Build MoonWake + SukiSU Nova (ruby)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git ccache flex bison build-essential \
            libssl-dev libelf-dev libncurses5-dev libncursesw5-dev \
            libdw-dev binutils-dev dwarves rsync zip curl wget python3

      - name: Clone MoonWake kernel source (moon / 2.7.0)
        run: |
          git clone --depth=1 https://github.com/DXRN-MoonWake/moonwake_kernel_xiaomi_ruby.git -b moon kernel
          cd kernel
          echo "Kernel HEAD: $(git rev-parse --short HEAD)"

      - name: Clone clang toolchain (r563880 - same as official MoonWake build)
        run: |
          git clone --depth=1 https://gitlab.com/DR-KernelArchive/clang/r563880.git -b main toolchains/clang
          test -x toolchains/clang/bin/clang && toolchains/clang/bin/clang --version | head -2
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH

      - name: Clone AnyKernel3 (ruby branch)
        run: |
          git clone --depth=1 https://github.com/DXRN-MoonWake/AnyKernel3.git -b ruby AnyKernel3

      - name: Integrate SukiSU Nova into kernel source
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/scripts/sukisu.sh" ./sukisu.sh
          chmod +x ./sukisu.sh
          ./sukisu.sh
          echo "=== symlink check ==="
          ls -la drivers/kernelsu
          echo "=== Makefile check ==="
          grep -n "kernelsu" drivers/Makefile | tail -3
          echo "=== Kconfig check ==="
          grep -n "kernelsu/Kconfig" drivers/Kconfig | tail -3
          echo "=== SukiSU Kconfig present ==="
          test -f drivers/kernelsu/Kconfig && echo "OK: SukiSU kernel source ready"

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=rainyxeon
          export KBUILD_BUILD_HOST=cloud-build
          KCFLAGS="-O3 -march=armv8.2-a+crypto+fp16+dotprod -mcpu=cortex-a78 -mtune=cortex-a78"
          MAKEARGS="O=out KCFLAGS=$KCFLAGS ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          # 1) base defconfig
          make -j$(nproc) $MAKEARGS ruby_defconfig

          # 2) install SukiSU feature config on top (fixes KPROBES/KALLSYMS dependency)
          cp "$GITHUB_WORKSPACE/sukisu.config" arch/arm64/configs/vendor/sukisu.config
          make -j$(nproc) $MAKEARGS vendor/sukisu.config

          echo "=== Final config verification ==="
          grep -E "^CONFIG_(KSU|KPM|KPROBES|EXT4_FS|KALLSYMS)=" out/.config || true
          echo "=== KSU must be y ==="
          grep -q "^CONFIG_KSU=y" out/.config || { echo "ERROR: CONFIG_KSU not enabled!"; exit 1; }

          # 3) build
          make -j$(nproc) $MAKEARGS Image.gz-dtb

          test -f out/arch/arm64/boot/Image.gz-dtb || { echo "ERROR: no Image.gz-dtb"; exit 1; }
          echo "[+] Kernel built:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel zip
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          ZIPNAME="MoonWake-SukiSU-Nova-ruby-$(date '+%Y%m%d-%H%M').zip"
          zip -r9 "../$ZIPNAME" * -x .git
          cd ..
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          echo "[+] Packaged:"
          ls -lh "$ZIPNAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonWake-SukiSU-Nova-ruby
          path: "*.zip"
          compression-level: 0
          retention-days: 90
